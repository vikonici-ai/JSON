<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Alerts and Modals</title>
    </head>


<button id="alertBtn">Open Alert</button>
<button id="openModals">Open Modal</button>

<div id="modal" style="display:none; position: fixed; top:0; left:0; width:100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 9999;">
    <div style="position: relative; margin: 10% auto; padding: 20px; background: white; width: 300px; text-align:center;">
        <p>This is a modal message</p>
        <button id="closeModal">Close</button>
    </div>
</div>

<script>


let alertButton = document.getElementById("alertBtn");
let modal = document.getElementById("modal");
let openModal = document.getElementById("openModals");
let closeModal = document.getElementById("closeModal");

openModal.addEventListener("click", function(){
    modal.style.display = "block";
});

closeModal.addEventListener("click", function(){
    modal.style.display = "none";
});





</script>






<body>


    <h1>Random Greeting</h1>

    <button id="get-greeting"> Greet Me</button>

    <div id="greeting"></div>

<script>

let getGreeting = document.getElementById("get-greeting");
let greeting = document.getElementById("greeting");

async function getGreetings () {
    const response = await fetch("fruits.json");
    console.log(response);

    const data = await response.json();
    console.log(data);

    const fruits = data.fruits;
    console.log(fruits);

    greeting.textContent = fruits[Math.floor(Math.random() * fruits.length)];
}

getGreeting.addEventListener("click", getGreetings);

</script>

</body>

</html>
